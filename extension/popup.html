<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>portal-auto-login</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="brand"><h1>portal-auto-login</h1></header>
    <label class="control" for="enabled">
      <span class="control-title">自动登录</span>
      <span class="switch">
        <input id="enabled" type="checkbox" role="switch" aria-label="自动登录" aria-describedby="status" disabled>
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>
    <div class="status-line" data-tone="muted"><span class="status-dot" aria-hidden="true"></span><p id="status" role="status" aria-live="polite">正在读取…</p></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
